logging:
  pattern:
    level: '%5p [traceId=%X{traceId:-}]'

server:
  port: 8080
  servlet:
    context-path: /api

module-path:
  member: "/member"

spring:
  application:
    name: CramSchool
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cram_school
    username: root
    password: password
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.school.entity
  configuration:
    map-underscore-to-camel-case: true

security:
  auth:
    jwt-secret: li6NElLGIrcN6+IwCkB8nxBNnrwy4KkXVpBoeB63cK0=


